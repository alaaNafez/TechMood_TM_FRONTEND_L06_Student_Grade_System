<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Student Grade System</title>
</head>
<body>
<div class="container">
    <h1>Student Grade System</h1>
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter student name">
        <label for="studentGrade">Student Grade:</label>
        <input type="number" id="studentGrade" min="0" max="100" placeholder="Enter student grade">
    <button type="button" id ="checkGrade">Check Grade</button>
    <div class="result">Result : <span id ="result"></span></div>
    
    </div>
    <script src="./js/script.js"></script> 
</body>
</html>
